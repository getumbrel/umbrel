name: Umbrel
options:
  bundleIdPrefix: com.umbrel
  deploymentTarget:
    # Active upload-job reconciliation uses PhotoKit's Action.process API.
    iOS: "26.5"
  createIntermediateGroups: true

packages:
  UmbrelKit:
    path: ../UmbrelKit

schemes:
  Umbrel:
    build:
      targets:
        Umbrel: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UmbrelTests
        - UmbrelUITests

targets:
  UmbrelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Umbrel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umbrel.app.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Umbrel.app/Umbrel
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.umbrel.app.dev.tests

  UmbrelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Umbrel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umbrel.app.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Umbrel
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.umbrel.app.dev.uitests

  Umbrel:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Shared Icon Composer source used by both the iOS and macOS apps.
      - path: ../AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: UmbrelKit
      - target: UmbrelPhotoBackgroundUpload
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Umbrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Black launch background so cold launch doesn't flash white before the app
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Discovery: browse _umbrel._tcp on the local network (same as macOS Connect)
        NSLocalNetworkUsageDescription: Umbrel finds your Umbrel devices on your local network.
        NSBonjourServices:
          - _umbrel._tcp
        # Native API traffic uses pinned HTTPS over both LAN and Tailscale. PhotoKit
        # background uploads still use HTTP to a Tailscale-range literal, so keep this
        # narrow exception without allowing arbitrary internet HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Since iOS 17, HTTP to literal IPs needs an explicit address exception.
          # Limit it to Tailscale's CGNAT range. Every saved endpoint is
          # identity-checked before use.
          NSExceptionDomains:
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
        # Photo backup reads the library to upload photos and videos to the user's Umbrel
        NSPhotoLibraryUsageDescription: Choose Allow Full Access to automatically back up the photos and videos in your library to your Umbrel.
        # Apple permits an App Group identifier to scope Keychain items shared with an
        # extension. Only the photo upload grant is written into this group.
        UmbrelPhotoBackupKeychainAccessGroup: $(APP_GROUP_IDENTIFIER)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umbrel.app
        APP_GROUP_IDENTIFIER: group.com.umbrel.app.photos
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "28"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Umbrel.entitlements
        # Keep signing pinned in the XcodeGen source so regenerating the project
        # continues to use the Umbrel, Inc. team.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JABS8D63XG
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.umbrel.app.dev
          APP_GROUP_IDENTIFIER: group.com.umbrel.app.dev

  UmbrelPhotoBackgroundUpload:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: BackgroundUploadExtension
    dependencies:
      - package: UmbrelKit
    info:
      path: BackgroundUploadExtension/Info.plist
      properties:
        CFBundleDisplayName: Umbrel Photo Backup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # PhotoKit requires one signed BackgroundUploadURLBase for network validation,
        # but it cannot vary per user's Umbrel. Actual jobs use the verified Tailscale
        # address in shared configuration. In a clean-install iOS 26.6.1 physical test,
        # this key was http://umbrel-photo-upload-test.invalid while jobs successfully
        # uploaded to a verified 100.64.0.0/10 address with the phone locked. Apple does
        # not document this separate-host behavior, so keep it in physical release tests.
        BackgroundUploadURLBase: http://umbrel.local
        UmbrelPhotoBackupKeychainAccessGroup: $(APP_GROUP_IDENTIFIER)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.photos.background-upload
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umbrel.app.photo-background-upload
        APP_GROUP_IDENTIFIER: group.com.umbrel.app.photos
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "28"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: BackgroundUploadExtension/UmbrelPhotoBackgroundUpload.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JABS8D63XG
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.umbrel.app.dev.photo-background-upload
          APP_GROUP_IDENTIFIER: group.com.umbrel.app.dev
