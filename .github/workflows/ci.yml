name: CI

on: push

jobs:
  # Detect if only UI files changed to skip heavy tests
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      ui-only: ${{ steps.check.outputs.ui-only }}
      ui-changed: ${{ steps.check.outputs.ui-changed }}
      apple-changed: ${{ steps.check.outputs.apple-changed }}
      android-changed: ${{ steps.check.outputs.android-changed }}
      run-pi-tests: ${{ steps.pi.outputs.run-pi-tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          # On default branch, always run all tests
          if [[ "${{ github.ref }}" == "refs/heads/${DEFAULT_BRANCH}" || "${{ github.ref }}" == refs/tags/* ]]; then
            echo "ui-only=false" >> $GITHUB_OUTPUT
            echo "ui-changed=true" >> $GITHUB_OUTPUT
            echo "apple-changed=true" >> $GITHUB_OUTPUT
            echo "android-changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get changed files for the entire PR/branch, not just the latest push.
          # This workflow currently runs on push events, so compare non-default
          # branches against their merge base with the default branch. If the
          # workflow is later run on pull_request events, use the PR base/head.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            DIFF_BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            DIFF_HEAD=HEAD
          else
            git fetch origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            DIFF_BASE=$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)
            DIFF_HEAD=HEAD
          fi

          CHANGED_FILES=$(git diff --name-only "$DIFF_BASE" "$DIFF_HEAD")

          # Check whether all changed files are in packages/ui/, and whether
          # anything that can affect the UI changed.
          UI_ONLY="true"
          UI_CHANGED="false"
          APPLE_CHANGED="false"
          ANDROID_CHANGED="false"
          while IFS= read -r file; do
            if [[ -n "$file" && ! "$file" =~ ^packages/ui/ ]]; then
              UI_ONLY="false"
            fi

            case "$file" in
              packages/ui/*|packages/umbreld/*|.github/workflows/ci.yml)
                UI_CHANGED="true"
                ;;
            esac

            case "$file" in
              clients/apple/*|.github/workflows/ci.yml)
                APPLE_CHANGED="true"
                ;;
            esac

            case "$file" in
              clients/android/*|.github/workflows/ci.yml)
                ANDROID_CHANGED="true"
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [[ -z "$CHANGED_FILES" ]]; then
            UI_ONLY="false"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "UI only: $UI_ONLY"
          echo "UI changed: $UI_CHANGED"
          echo "Apple changed: $APPLE_CHANGED"
          echo "Android changed: $ANDROID_CHANGED"
          echo "ui-only=$UI_ONLY" >> $GITHUB_OUTPUT
          echo "ui-changed=$UI_CHANGED" >> $GITHUB_OUTPUT
          echo "apple-changed=$APPLE_CHANGED" >> $GITHUB_OUTPUT
          echo "android-changed=$ANDROID_CHANGED" >> $GITHUB_OUTPUT
      # The Pi VM tests boot the production Pi image in an emulated Raspberry
      # Pi 4. Emulation is TCG-only (no hardware acceleration exists for the
      # raspi4b machine) so they're the slowest jobs in CI and only run on
      # master/staging/tags, or on branches whose open PR has the "pi-tests"
      # label.
      #
      # IMPORTANT: make sure to add the "pi-tests" label to PRs that should be
      # tested against Pi-specific logic — anything touching packages/os
      # boot/storage behaviour, the pi handling in vm.sh, device detection, or
      # the *.pi.vm.test.ts suites — so it's exercised on the emulated Pi
      # before merge instead of breaking on staging. This workflow only runs on
      # push events, so after labelling an already-pushed PR use "Re-run all
      # jobs" (the label is read live from the API, not the event payload).
      - id: pi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/staging" || "${{ github.ref }}" == refs/tags/* ]]; then
            echo "run-pi-tests=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          labels=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json labels --jq '.[].labels[].name' || true)
          if grep --quiet --line-regexp 'pi-tests' <<< "$labels"; then
            echo "run-pi-tests=true" >> $GITHUB_OUTPUT
          else
            echo "run-pi-tests=false" >> $GITHUB_OUTPUT
          fi

  # These jobs simply serve as architecture native cache steps to load up the Docker cache for umbrelOS.
  # We must cache to unique scopes per architecture otherwise only one of the architectures gets cached.
  umbrelos-amd64-cache:
    name: Build umbrelOS amd64
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-only != 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          # Use the BuildKit that build.sh pins, so layers built and cached here match
          # what a local build produces. Keep in sync with BUILDKIT_IMAGE in
          # packages/os/build.sh.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build amd64 Docker image
        working-directory: packages/os
        run: docker buildx build --platform linux/amd64 --file umbrelos.Dockerfile --target umbrelos --cache-from type=gha,scope=umbrelos-amd64 --cache-to type=gha,mode=max,scope=umbrelos-amd64 ../../
  umbrelos-arm64-cache:
    name: Build umbrelOS arm64
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-only != 'true'
    runs-on: ubicloud-standard-4-arm-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          # Use the BuildKit that build.sh pins, so layers built and cached here match
          # what a local build produces. Keep in sync with BUILDKIT_IMAGE in
          # packages/os/build.sh.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build arm64 Docker image
        working-directory: packages/os
        run: docker buildx build --platform linux/arm64 --file umbrelos.Dockerfile --target umbrelos --cache-from type=gha,scope=umbrelos-arm64 --cache-to type=gha,mode=max,scope=umbrelos-arm64 ../../
  umbrelos-pi-cache:
    name: Build umbrelOS Pi
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-only != 'true'
    runs-on: ubicloud-standard-4-arm-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          # Use the BuildKit that build.sh pins, so layers built and cached here match
          # what a local build produces. Keep in sync with BUILDKIT_IMAGE in
          # packages/os/build.sh.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build Pi Docker image
        working-directory: packages/os
        run: docker buildx build --platform linux/arm64 --build-arg BASE_VARIANT=-pi --file umbrelos.Dockerfile --target umbrelos --cache-from type=gha,scope=umbrelos-pi --cache-to type=gha,mode=max,scope=umbrelos-pi ../../

  # Check the software installed in each umbrelOS image against the committed
  # lists in packages/os/package-versions/. This runs alongside the VM tests, so
  # it doesn't hold them up.
  umbrelos-package-versions:
    name: Check umbrelOS ${{ matrix.variant }} package versions
    needs: [detect-changes, umbrelos-amd64-cache, umbrelos-arm64-cache, umbrelos-pi-cache]
    if: needs.detect-changes.outputs.ui-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: amd64
            runner: ubicloud-standard-4-ubuntu-2404
            build-args: --platform linux/amd64
          - variant: arm64
            runner: ubicloud-standard-4-arm-ubuntu-2404
            build-args: --platform linux/arm64
          - variant: pi
            runner: ubicloud-standard-4-arm-ubuntu-2404
            build-args: --platform linux/arm64 --build-arg BASE_VARIANT=-pi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Compare package versions
        working-directory: packages/os
        run: docker buildx build ${{ matrix.build-args }} --file umbrelos.Dockerfile --target umbrelos --cache-from type=gha,scope=umbrelos-${{ matrix.variant }} --load --tag umbrelos ../../ && docker run --rm --entrypoint bash --volume "$PWD/package-versions.sh:/package-versions.sh:ro" umbrelos /package-versions.sh | diff --unified package-versions/${{ matrix.variant }}.txt -

  # Build the image for the VM tests
  # We run this in a seperate step so we only build it once and reuse for all VM runners to reduce billed minutes.
  umbrelos-amd64-vm-image-build:
    name: Build umbrelOS amd64 VM image
    needs: [detect-changes, umbrelos-amd64-cache]
    if: needs.detect-changes.outputs.ui-only != 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    outputs:
      image-key: ${{ steps.image-key.outputs.key }}
      update-bundle-key: ${{ steps.update-bundle-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Use the BuildKit that build.sh pins, so layers built and cached here match
          # what a local build produces. Keep in sync with BUILDKIT_IMAGE in
          # packages/os/build.sh.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Expose GitHub Actions runtime for Docker cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build OS image
        working-directory: packages/os
        # SKIP_CACHE_EXPORT: the umbrelos-amd64-cache job (a dependency of this
        # job) has already exported these layers to the gha cache, so skip the
        # redundant re-export. It can intermittently fail the build with cache
        # backend errors, which would block every VM test that depends on this
        # image; the --cache-from import keeps the build fast regardless.
        run: SKIP_CACHE_EXPORT=true npm run build:amd64:rugix
      # The build is reproducible, so building this commit anywhere else should
      # give the same checksums.
      - name: Show OS image checksums
        working-directory: packages/os
        run: sha256sum build/umbrelos-amd64.img build/umbrelos-amd64.update
      # Hack to pass the image to the next job. We used to use upload-artifact but network performance
      # is terrible between GitHub <> Ubicloud. Just abuse the cache for now which is local and fast.
      # Each attempt saves under its own key. A failed save can leave its key
      # reserved, so a re-run reusing it could never save the image.
      - name: Choose OS image cache key
        id: image-key
        run: echo "key=umbrelos-amd64-image-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Cache OS image
        uses: actions/cache/save@v5
        with:
          path: packages/os/build/umbrelos-amd64.img
          key: ${{ steps.image-key.outputs.key }}
      # actions/cache/save only warns when saving fails, and then every VM test
      # job fails to restore the image. Fail here instead, where re-running this
      # job recovers. The lookup is retried once like the VM jobs' restore.
      - name: Check the OS image was cached
        id: check-os-image
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-amd64.img
          key: ${{ steps.image-key.outputs.key }}
          lookup-only: true
      - name: Wait before checking the OS image again
        if: steps.check-os-image.outputs.cache-hit != 'true'
        run: sleep 10
      - name: Check the OS image was cached again
        if: steps.check-os-image.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-amd64.img
          key: ${{ steps.image-key.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true
      # The update bundle is cached separately, the same way, so only the OS
      # update tests restore it. The glob includes the bundle hash build.sh records.
      - name: Choose OS update bundle cache key
        id: update-bundle-key
        run: echo "key=umbrelos-amd64-update-bundle-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Cache OS update bundle
        uses: actions/cache/save@v5
        with:
          path: packages/os/build/umbrelos-amd64.update*
          key: ${{ steps.update-bundle-key.outputs.key }}
      - name: Check the OS update bundle was cached
        id: check-update-bundle
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-amd64.update*
          key: ${{ steps.update-bundle-key.outputs.key }}
          lookup-only: true
      - name: Wait before checking the OS update bundle again
        if: steps.check-update-bundle.outputs.cache-hit != 'true'
        run: sleep 10
      - name: Check the OS update bundle was cached again
        if: steps.check-update-bundle.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-amd64.update*
          key: ${{ steps.update-bundle-key.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true

  umbrelos-pi-vm-image-build:
    name: Build umbrelOS Pi VM image
    needs: [detect-changes, umbrelos-pi-cache]
    if: needs.detect-changes.outputs.ui-only != 'true' && needs.detect-changes.outputs.run-pi-tests == 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    outputs:
      image-key: ${{ steps.image-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Use the BuildKit that build.sh pins, so layers built and cached here match
          # what a local build produces. Keep in sync with BUILDKIT_IMAGE in
          # packages/os/build.sh.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Expose GitHub Actions runtime for Docker cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build OS image
        working-directory: packages/os
        # SKIP_CACHE_EXPORT: the umbrelos-pi-cache job (a dependency of this job)
        # has already exported these layers to the gha cache, so skip the
        # redundant re-export. It can intermittently fail the build with cache
        # backend errors, which would block the Pi VM test that depends on this
        # image; the --cache-from import keeps the build fast regardless.
        run: SKIP_CACHE_EXPORT=true npm run build:pi5
      # Each attempt saves under its own key. A failed save can leave its key
      # reserved, so a re-run reusing it could never save the image.
      - name: Choose OS image cache key
        id: image-key
        run: echo "key=umbrelos-pi-image-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Cache OS image
        uses: actions/cache/save@v5
        with:
          path: packages/os/build/umbrelos-pi.img
          key: ${{ steps.image-key.outputs.key }}
      # actions/cache/save only warns when saving fails, and then every VM test
      # job fails to restore the image. Fail here instead, where re-running this
      # job recovers. The lookup is retried once like the VM jobs' restore.
      - name: Check the OS image was cached
        id: check-os-image
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-pi.img
          key: ${{ steps.image-key.outputs.key }}
          lookup-only: true
      - name: Wait before checking the OS image again
        if: steps.check-os-image.outputs.cache-hit != 'true'
        run: sleep 10
      - name: Check the OS image was cached again
        if: steps.check-os-image.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-pi.img
          key: ${{ steps.image-key.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true

  # Discover all MV test files so we can run the result as a build matrix
  discover-vm-tests:
    name: Discover VM tests
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-only != 'true'
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.find.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: |
          tests=$(
            find packages/umbreld/source -name "*.vm.test.ts" ! -name "*.pi.vm.test.ts" |
              while IFS= read -r test_path; do
                relative_path="${test_path#packages/umbreld/}"
                name="$(basename "${test_path}" .vm.test.ts)"
                requires_playwright=false
                if grep --quiet '^// @vm-requires-playwright$' "${test_path}"; then
                  requires_playwright=true
                fi
                requires_update_bundle=false
                if grep --quiet '^// @vm-requires-update-bundle$' "${test_path}"; then
                  requires_update_bundle=true
                fi
                jq --null-input --compact-output \
                  --arg path "${relative_path}" \
                  --arg name "${name}" \
                  --argjson requiresPlaywright "${requires_playwright}" \
                  --argjson requiresUpdateBundle "${requires_update_bundle}" \
                  '{path: $path, name: $name, requiresPlaywright: $requiresPlaywright, requiresUpdateBundle: $requiresUpdateBundle}'
              done |
              jq --slurp --compact-output
          )
          echo "tests=$tests" >> $GITHUB_OUTPUT

  # Pi VM tests run from the Pi image in an emulated Raspberry Pi 4 so they get
  # their own matrix instead of the generic amd64 image one.
  discover-pi-vm-tests:
    name: Discover Pi VM tests
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-only != 'true' && needs.detect-changes.outputs.run-pi-tests == 'true'
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.find.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: |
          tests=$(find packages/umbreld/source -name "*.pi.vm.test.ts" | sed 's|packages/umbreld/||' | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({path: ., name: (. | split("/") | last | sub("\\.pi\\.vm\\.test\\.ts$"; ""))})')
          echo "tests=$tests" >> $GITHUB_OUTPUT

  # Run each VM test in a different runner
  umbrelos-amd64-vm:
    name: VM test (${{ matrix.test.name }})
    needs: [detect-changes, umbrelos-amd64-vm-image-build, discover-vm-tests]
    if: needs.detect-changes.outputs.ui-only != 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-vm-tests.outputs.tests) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26
      # The cache service intermittently answers the lookup with HTTP 500,
      # which restore treats as a miss. Wait briefly and retry once before
      # failing the job.
      - name: Restore OS image from cache
        id: restore-os-image
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-amd64.img
          key: ${{ needs.umbrelos-amd64-vm-image-build.outputs.image-key }}
      - name: Wait before retrying OS image restore
        if: steps.restore-os-image.outputs.cache-hit != 'true'
        run: sleep 10
      - name: Retry restoring OS image from cache
        if: steps.restore-os-image.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-amd64.img
          key: ${{ needs.umbrelos-amd64-vm-image-build.outputs.image-key }}
          fail-on-cache-miss: true
      - name: Restore OS update bundle from cache
        id: restore-update-bundle
        if: matrix.test.requiresUpdateBundle
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-amd64.update*
          key: ${{ needs.umbrelos-amd64-vm-image-build.outputs.update-bundle-key }}
      - name: Wait before retrying OS update bundle restore
        if: matrix.test.requiresUpdateBundle && steps.restore-update-bundle.outputs.cache-hit != 'true'
        run: sleep 10
      - name: Retry restoring OS update bundle from cache
        if: matrix.test.requiresUpdateBundle && steps.restore-update-bundle.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-amd64.update*
          key: ${{ needs.umbrelos-amd64-vm-image-build.outputs.update-bundle-key }}
          fail-on-cache-miss: true
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      # Retried once: a dropped registry connection (ECONNRESET) or a race in
      # npm's own cache (EEXIST) has failed this step, and with it the job
      - name: Install umbreld dependencies
        working-directory: packages/umbreld
        run: |
          npm clean-install || {
            echo "::warning title=Retried npm install::npm clean-install failed, retrying once"
            sleep 10
            npm clean-install
          }
      - name: Install browser for LAN ingress end-to-end test
        if: matrix.test.requiresPlaywright
        working-directory: packages/umbreld
        run: npx playwright install --with-deps chromium
      # VM tests boot a full OS and exercise real reboots, storage and networking,
      # so a small per-test flake rate adds up across ~100 of them and most runs
      # had at least one failure. A failed test file is retried once with a fresh
      # VM and only fails the job if both attempts fail. A pass on retry is
      # annotated as flaky so it stays visible on the run summary; don't ignore
      # them, track and fix them like any other failure.
      - name: Run VM test
        id: vm-test
        continue-on-error: true
        working-directory: packages/umbreld
        run: npm run test -- ${{ matrix.test.path }}
      - name: Retry VM test
        if: steps.vm-test.outcome == 'failure'
        working-directory: packages/umbreld
        run: |
          npm run test -- ${{ matrix.test.path }}
          echo "::warning title=Flaky VM test (${{ matrix.test.name }})::Failed on the first attempt and passed on retry"

  umbrelos-pi-vm:
    name: Pi VM test (${{ matrix.test.name }})
    needs: [umbrelos-pi-vm-image-build, discover-pi-vm-tests]
    runs-on: ubicloud-standard-4-ubuntu-2404
    env:
      # nixpkgs revision QEMU is built from (nixos-26.05 as of 2026-07). Bump
      # deliberately to change the emulator version — the cache key below
      # picks up the new revision automatically.
      NIXPKGS_REV: bd0ff2d3eac24699c3664d5966b9ef36f388e2ca
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-pi-vm-tests.outputs.tests) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26
      # The cache service intermittently answers the lookup with HTTP 500,
      # which restore treats as a miss. Wait briefly and retry once before
      # failing the job.
      - name: Restore OS image from cache
        id: restore-os-image
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-pi.img
          key: ${{ needs.umbrelos-pi-vm-image-build.outputs.image-key }}
      - name: Wait before retrying OS image restore
        if: steps.restore-os-image.outputs.cache-hit != 'true'
        run: sleep 10
      - name: Retry restoring OS image from cache
        if: steps.restore-os-image.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: packages/os/build/umbrelos-pi.img
          key: ${{ needs.umbrelos-pi-vm-image-build.outputs.image-key }}
          fail-on-cache-miss: true
      - name: Prepare Nix store for caching
        run: sudo mkdir -p /nix && sudo chown "$(id -un)" /nix
      - name: Cache QEMU from nixpkgs
        id: nix-qemu-cache
        uses: actions/cache@v5
        with:
          path: /nix
          key: nix-qemu-${{ runner.os }}-${{ env.NIXPKGS_REV }}
      - name: Install QEMU
        # QEMU's raspi4b machine needs QEMU >= 9.0 but Ubuntu 24.04 only
        # packages 8.2, so QEMU comes from nixpkgs pinned to the exact
        # revision above — the emulator and its whole dependency closure are
        # deterministic, unlike a rolling package manager. The store is cached
        # so Nix itself only runs on a cache miss; /nix/qemu is a stable
        # symlink into the store so PATH works on both hit and miss (the
        # closure is self-contained, no Nix needed at runtime).
        run: |
          sudo apt-get update && sudo apt-get install -y fdisk mtools device-tree-compiler
          if [[ "${{ steps.nix-qemu-cache.outputs.cache-hit }}" != "true" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf -L https://nixos.org/nix/install | sh -s -- --no-daemon
            . "$HOME/.nix-profile/etc/profile.d/nix.sh"
            nix build --extra-experimental-features 'nix-command flakes' \
              "github:NixOS/nixpkgs/${NIXPKGS_REV}#qemu" --out-link /nix/qemu
          fi
          echo "/nix/qemu/bin" >> "$GITHUB_PATH"
          /nix/qemu/bin/qemu-system-aarch64 --version
      # Retried once: a dropped registry connection (ECONNRESET) or a race in
      # npm's own cache (EEXIST) has failed this step, and with it the job
      - name: Install umbreld dependencies
        working-directory: packages/umbreld
        run: |
          npm clean-install || {
            echo "::warning title=Retried npm install::npm clean-install failed, retrying once"
            sleep 10
            npm clean-install
          }
      # Retried once with a fresh VM for the same reason as the amd64 VM tests
      - name: Run Pi VM test
        id: vm-test
        continue-on-error: true
        working-directory: packages/umbreld
        run: npm run test -- ${{ matrix.test.path }}
      - name: Retry Pi VM test
        if: steps.vm-test.outcome == 'failure'
        working-directory: packages/umbreld
        run: |
          npm run test -- ${{ matrix.test.path }}
          echo "::warning title=Flaky Pi VM test (${{ matrix.test.name }})::Failed on the first attempt and passed on retry"

  # Discover all integration test files so we can run the result as a build matrix
  discover-integration-tests:
    name: Discover integration tests
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-only != 'true'
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.find.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: |
          tests=$(find packages/umbreld/source -name "*.integration.test.ts" | sed 's|packages/umbreld/||' | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({path: ., name: (. | split("/") | last | sub("\\.integration\\.test\\.ts$"; ""))})')
          echo "tests=$tests" >> $GITHUB_OUTPUT

  # Run each integration test in a different runner
  umbreld-integration:
    name: Integration test (${{ matrix.test.name }})
    needs: [detect-changes, discover-integration-tests, umbrelos-amd64-cache]
    if: needs.detect-changes.outputs.ui-only != 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-integration-tests.outputs.tests) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Use the BuildKit that build.sh pins, so layers built and cached here match
          # what a local build produces. Keep in sync with BUILDKIT_IMAGE in
          # packages/os/build.sh.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Expose GitHub Actions runtime for Docker cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: npm run dev rebuild
        env:
          # The umbrelos-amd64-cache job has already exported these layers to the
          # gha cache. Re-exporting them from every integration job in parallel
          # overwhelms the cache backend and intermittently fails the build with
          # 429/504/not_found errors, which surfaced as flaky integration tests.
          UMBREL_DEV_SKIP_CACHE_EXPORT: 'true'
      - run: npm run dev start
      - run: npm run --prefix packages/umbreld test:umbrel-dev:prepare
      # Retried once for the same reason as the VM tests. Each run creates its own
      # umbreld instances, so the retry reuses the running umbrel-dev container.
      - name: Run integration test
        id: integration-test
        continue-on-error: true
        run: npm run --prefix packages/umbreld test:umbrel-dev ${{ matrix.test.path }}
      - name: Retry integration test
        if: steps.integration-test.outcome == 'failure'
        run: |
          npm run --prefix packages/umbreld test:umbrel-dev ${{ matrix.test.path }}
          echo "::warning title=Flaky integration test (${{ matrix.test.name }})::Failed on the first attempt and passed on retry"

  # Run umbreld checks
  umbreld:
    name: umbreld checks
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-only != 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/umbreld
    strategy:
      fail-fast: false
      matrix:
        task:
          - format:check
          - typecheck
          - test:unit -- --coverage
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26
      # sudo resets PATH, which would run the runner's own Node.js instead of setup-node's
      - name: Install dependencies
        run: |
          sudo env "PATH=$PATH" npm clean-install || {
            echo "::warning title=Retried npm install::sudo npm clean-install failed, retrying once"
            sleep 10
            sudo env "PATH=$PATH" npm clean-install
          }
      - run: sudo env "PATH=$PATH" npm run ${{ matrix.task }}

  # Run the shared Apple client tests and compile both native apps. The macOS 26
  # runner includes the iOS 26.5 SDK required by the generated iOS project.
  apple:
    name: Apple client checks
    needs: detect-changes
    if: needs.detect-changes.outputs.apple-changed == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test UmbrelKit
        run: swift test --package-path clients/apple/UmbrelKit
      - name: Generate macOS project
        working-directory: clients/apple/macos
        run: xcodegen generate
      - name: Build macOS app
        working-directory: clients/apple/macos
        run: >-
          xcodebuild
          -project Umbrel.xcodeproj
          -scheme Umbrel
          -configuration Release
          -destination 'generic/platform=macOS'
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Generate iOS project
        working-directory: clients/apple/ios
        run: xcodegen generate
      - name: Build iOS app
        working-directory: clients/apple/ios
        run: >-
          xcodebuild
          -project Umbrel.xcodeproj
          -scheme Umbrel
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  # Run the Android app's unit tests and lint, and build its release bundle, which runs
  # R8 and resource shrinking. The bundle is unsigned: Play uploads are signed with the
  # upload key outside CI.
  android:
    name: Android client checks
    needs: detect-changes
    if: needs.detect-changes.outputs.android-changed == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/android
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test and lint
        run: ./gradlew :umbrelkit:testDebugUnitTest :app:testDebugUnitTest lint
      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

  # Run ui checks
  ui:
    name: ui checks
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-changed == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/ui
    strategy:
      fail-fast: false
      matrix:
        task:
          - lint
          - format:check
          - test:unit
          - typecheck
          - test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Install Umbreld dependencies
        if: ${{ matrix.task == 'typecheck' || matrix.task == 'test' }}
        run: |
          npm --prefix ../umbreld clean-install || {
            echo "::warning title=Retried npm install::npm --prefix ../umbreld clean-install failed, retrying once"
            sleep 10
            npm --prefix ../umbreld clean-install
          }
      - name: Install dependencies
        run: |
          npm clean-install || {
            echo "::warning title=Retried npm install::npm clean-install failed, retrying once"
            sleep 10
            npm clean-install
          }
      - run: npm run ${{ matrix.task }}

  # If the current build is tagged, build all release assets, push to Cloudflare R2 and create a GitHub Release
  create-release:
    name: Create release on tag
    if: startsWith(github.ref, 'refs/tags/')
    needs: [umbrelos-amd64-cache, umbrelos-arm64-cache, umbrelos-pi-cache]
    runs-on: ubicloud-standard-16-ubuntu-2404
    defaults:
      run:
        working-directory: packages/os
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Use the BuildKit that build.sh pins, so layers built and cached here match
          # what a local build produces. Keep in sync with BUILDKIT_IMAGE in
          # packages/os/build.sh.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Expose GitHub Actions runtime for Docker cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      # We need this to namespace Docker images on forks
      - run: echo "VERSION_IS_SEMVER=$(if [[ '${{ env.VERSION }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then echo 'true'; else echo 'false'; fi)" >> $GITHUB_ENV
      - run: echo "PREFIX=$(if [ '${{ env.VERSION_IS_SEMVER }}' = 'true' ]; then echo ''; else echo $(basename ${{ github.repository }})-; fi)" >> $GITHUB_ENV
      - run: echo "TAG=${{ github.repository_owner }}/${{ env.PREFIX }}umbrelos:${{ env.VERSION }}" >> $GITHUB_ENV
      # create-release-manifest.sh refuses a version tag without its release notes, so fail before the build
      # rather than after it
      - name: Check release notes
        if: env.VERSION_IS_SEMVER == 'true'
        run: test -f "release-notes/${VERSION}.md" || { echo "Release notes for ${VERSION} are missing from packages/os/release-notes/${VERSION}.md" >&2; exit 1; }
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      # Go through build.sh rather than pushing with docker buildx build
      # directly. It builds the single-layer umbrelos-docker stage with fixed
      # timestamps and no provenance attestation, which would otherwise make
      # the digest differ on every build.
      - name: Build and push Docker image
        run: SKIP_ROOTS=true SKIP_RUGIX_ARTIFACTS=true DOCKER_IMAGE_OUTPUT="type=image,name=ghcr.io/${{ env.TAG }},push=true" ./build.sh
      # The image index's digest pins the image for every platform, and the release manifest signs it
      - run: echo "DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.PREFIX }}umbrelos@$(docker buildx imagetools inspect ghcr.io/${{ env.TAG }} --format '{{json .Manifest}}' | jq --raw-output .digest)" >> $GITHUB_ENV
      # Build OS images
      - uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Build OS images
        # Awkward hack to run in parallel but correctly handle errors.
        # The USB installer base ISO doesn't depend on the OS images and builds
        # in ~90s, so we build it concurrently (hidden under the much longer OS
        # builds) and inject the OS image into it at the end.
        run: |
          npm run build:amd64 "${{ env.VERSION }}" &
          pid1=$!
          npm run build:pi "${{ env.VERSION }}" &
          pid2=$!
          npm run build:amd64:usb-installer:base &
          pid3=$!
          wait $pid1 || exit 1
          wait $pid2 || exit 1
          wait $pid3 || exit 1
      # TODO: Use .img.xz for all release assets once https://github.com/balena-io/etcher/issues/4064 is fixed
      - name: Compress release assets
        # Awkward hack to run in parallel but correctly handle errors.
        # zip -X leaves out the image's owner and access time, and TZ=UTC stops
        # the runner's timezone changing the recorded modification time, so the
        # zip is reproducible.
        run: |
          cd build
          TZ=UTC zip -X umbrelos-pi.img.zip umbrelos-pi.img &
          pid1=$!
          sudo xz --keep --threads=0 umbrelos-amd64.img &
          pid2=$!
          wait $pid1 || exit 1
          wait $pid2 || exit 1
      - name: Create USB installer (inject umbrelOS image into base ISO)
        run: npm run build:amd64:usb-installer:inject
      - name: Create release directory
        run: |
          mkdir -p release
          mv build/*.update release/
          mv build/*.img.zip release/
          mv build/*.img.xz release/
          mv build/*.img release/
          mv build/umbrelos-amd64-usb-installer.iso release/
          # A release that needs to run something to install has an update script, which the manifest pins
          if [[ -f update.sh ]]; then cp update.sh release/; fi
      # The manifest pins every file in the release and gets timestamped here. Release signers sign it
      # and the release notes separately.
      - name: Create release manifest
        run: RELEASE_TAG="${{ env.VERSION }}" ./create-release-manifest.sh release && cat release/manifest.txt
      - name: OpenTimestamps
        run: npm ci && npx ots-cli.js stamp release/manifest.txt
      - name: Nuke uncompressed images (we just wanted them covered by the manifest)
        run: rm -rf release/*.img
      - name: Upload to R2
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: packages/os/release
          destination-dir: ./${{ env.VERSION }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: umbrelOS ${{ github.ref_name }}
          files: |
            packages/os/release/manifest.txt*
            packages/os/release/release-notes.md
