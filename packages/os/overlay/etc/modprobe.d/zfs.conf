# Make the ARC a cheaper reclaim target than application memory. The kernel
# weighs each shrinker by its "seeks" cost; ZFS defaults to 2, the same as the
# page cache. With zram swap and a high vm.swappiness, that makes the kernel
# prefer compressing active app pages over evicting ARC data under memory
# pressure. Halving the cost means the ARC gives ground first. This parameter
# is read-only at runtime, so it has to be set at module load.
options zfs zfs_arc_shrinker_seeks=1
