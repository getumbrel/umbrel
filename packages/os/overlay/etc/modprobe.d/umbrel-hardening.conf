# Block kernel modules that umbrelOS doesn't use but that any local process,
# including one in a container, could otherwise get loaded on demand, for
# example by opening a socket of the right type. Rarely used kernel code like
# this is where many kernel vulnerabilities are found, so keeping it unloaded
# shrinks the attack surface.
#
# "blacklist" stops a module loading through an alias, such as a socket family.
# "install <module> /bin/false" makes every other modprobe load fail, including
# loads as a dependency, so modules built on top of a blocked one fail too.

# AF_RXRPC sockets, the transport for the AFS network filesystem. Vulnerable to
# DirtyFrag (CVE-2026-43500).
blacklist rxrpc
install rxrpc /bin/false

# AF_ALG AEAD sockets, which expose the kernel's authenticated encryption
# ciphers to userspace. Software almost always uses userspace crypto instead.
# Vulnerable to CopyFail (CVE-2026-31431).
blacklist algif_aead
install algif_aead /bin/false

# IPsec ESP, the encryption used by IPsec VPNs. VPN apps on umbrelOS use
# WireGuard instead. Reachable from inside a user namespace, and has had
# repeated privilege escalation bugs, most recently DirtyFrag (CVE-2026-43284).
# Also blocks the ESP offload modules built on it.
blacklist esp4
install esp4 /bin/false
blacklist esp6
install esp6 /bin/false

# Reliable Datagram Sockets, used by Oracle database clusters. Has a long
# history of local privilege escalation bugs.
blacklist rds
install rds /bin/false

# Transparent Inter-Process Communication, a cluster messaging protocol. Had a
# remotely exploitable bug in 2021 (CVE-2021-43267).
blacklist tipc
install tipc /bin/false

# Kernel Connection Multiplexor, a socket API for message-based protocols over
# TCP.
blacklist kcm
install kcm /bin/false

# SCTP, a transport protocol used by telecom software. WebRTC implements its own
# SCTP in userspace and doesn't need it.
blacklist sctp
install sctp /bin/false

# PF_KEY, the legacy IPsec key management API. Current IPsec software such as
# strongSwan and Libreswan uses netlink instead.
blacklist af_key
install af_key /bin/false

# CAN bus, used in cars and industrial equipment. Also blocks the CAN protocols
# built on it (can-raw, can-bcm, can-gw, can-isotp and can-j1939).
blacklist can
install can /bin/false

# Phonet, Nokia's cellular modem protocol.
blacklist phonet
install phonet /bin/false

# ATM networking, used by old DSL modems.
blacklist atm
install atm /bin/false

# IEEE 802.15.4 low-power radio and 6LoWPAN, which carries IPv6 over it and over
# Bluetooth LE. Zigbee and Thread radios for home automation are driven from
# userspace over USB serial instead.
blacklist ieee802154
install ieee802154 /bin/false
blacklist 6lowpan
install 6lowpan /bin/false

# The kernel NFC subsystem. USB NFC readers are normally driven from userspace
# (libnfc, pcscd) instead.
blacklist nfc
install nfc /bin/false

# Amateur packet radio. Also blocks NET/ROM and ROSE, which are built on AX.25.
# Only Raspberry Pi kernels build these.
blacklist ax25
install ax25 /bin/false

# AppleTalk, the legacy Mac networking protocol. Mac file sharing uses SMB. Only
# Raspberry Pi kernels build this.
blacklist appletalk
install appletalk /bin/false
