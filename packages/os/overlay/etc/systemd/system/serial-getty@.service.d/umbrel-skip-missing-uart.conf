# The kernel console is on ttyS0, so systemd's getty generator starts a serial
# getty there even on hardware with no UART behind the port (e.g. Umbrel Pro).
# agetty then fails and is restarted every 10s forever. Skip the getty when the
# serial driver found no UART at the port (type 0 is PORT_UNKNOWN).
[Service]
ExecCondition=/bin/sh -c '! grep -qsx 0 /sys/class/tty/%I/type'
