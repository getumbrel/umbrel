# Reserve the host port range for Umbrel Machines port forwards
#
# umbreld only allows Machines to forward host ports 40000-49999 (MACHINES_PORT_MIN and
# MACHINES_PORT_MAX in umbreld's machines.ts). That range sits inside Linux's default
# ephemeral port range (32768-60999), so without this an outgoing connection can be
# assigned one of those ports and the forward then fails with a spurious port conflict.
# Reserved ports are only excluded from automatic assignment; explicit binds still work.
# This setting applies to both IPv4 and IPv6.
# https://docs.kernel.org/networking/ip-sysctl.html (ip_local_reserved_ports)
net.ipv4.ip_local_reserved_ports = 40000-49999
