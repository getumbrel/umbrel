# Only let processes that can already load kernel modules (CAP_SYS_MODULE) load
# TTY line discipline modules. Otherwise any process, including root in an app
# container, can get one loaded by opening a pseudo-terminal and switching its
# line discipline (TIOCSETD). These are rarely used drivers such as n_hdlc,
# slip and ppp_async, and n_hdlc has had a local privilege escalation bug
# (CVE-2017-2636). Everything on umbrelOS that legitimately uses them runs as
# root, and normal serial devices use the built-in n_tty discipline.
dev.tty.ldisc_autoload = 0
