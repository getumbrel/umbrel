version: '3.7'

services:
  server:
    image: getumbrel/community-app-store-hello-world:latest
    network_mode: host
    restart: on-failure
    user: '1000:1000'
    init: true
    command:
      - node
      - -e
      - |
        require('http').createServer((_request, response) => response.end('Host network app')).listen(4001, '0.0.0.0')
